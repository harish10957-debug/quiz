
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyber Quiz Arena</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header class="header">
            <h1 class="logo">⚡ CYBER QUIZ</h1>
            <p class="subtitle">
                ENTER THE DIGITAL KNOWLEDGE ARENA
            </p>
        </header>


        
        <section class="card" id="levelScreen">

            <h2 class="level-title">
                SELECT YOUR LEVEL
            </h2>

            <div class="levels">

                <button class="level-btn" onclick="startQuiz(0)">
                    <span class="level-number">01</span>
                    <span class="level-name">ROOKIE</span>
                </button>

                <button class="level-btn" onclick="startQuiz(1)">
                    <span class="level-number">02</span>
                    <span class="level-name">EXPLORER</span>
                </button>

                <button class="level-btn" onclick="startQuiz(2)">
                    <span class="level-number">03</span>
                    <span class="level-name">HACKER</span>
                </button>

                <button class="level-btn" onclick="startQuiz(3)">
                    <span class="level-number">04</span>
                    <span class="level-name">CYBER MASTER</span>
                </button>

                <button class="level-btn" onclick="startQuiz(4)">
                    <span class="level-number">05</span>
                    <span class="level-name">TECH LEGEND</span>
                </button>

            </div>

        </section>


      
        <section class="card" id="quizScreen">

            <div class="quiz-top">

                <div class="badge" id="levelBadge">
                    LEVEL 01
                </div>

                <div class="timer">
                    ⏱ <span id="time">15</span>s
                </div>

            </div>


            <!-- PROGRESS BAR -->
            <div class="progress-container">
                <div class="progress" id="progress"></div>
            </div>


            <!-- QUESTION -->
            <div class="question-number" id="questionNumber">
                QUESTION 1 / 10
            </div>

            <h2 class="question" id="question">
                Question goes here
            </h2>


            <!-- ANSWER OPTIONS -->
            <div class="options" id="options"></div>

        </section>


        <!-- RESULT SCREEN -->
        <section class="card" id="resultScreen">

            <div class="result">

                <div class="result-icon">
                    🏆
                </div>

                <h2>
                    MISSION COMPLETE
                </h2>

                <div class="score">
                    <span id="finalScore">0</span>/10
                </div>

                <p class="result-message" id="resultMessage">
                    Great job!
                </p>

                <button class="restart-btn" onclick="goHome()">
                    🚀 PLAY AGAIN
                </button>

            </div>

        </section>


        <footer class="footer">
            CYBER QUIZ ARENA • HTML • CSS • JAVASCRIPT
        </footer>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
